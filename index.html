<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İstanbul Film Mekanları Haritası</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23f03010'/></svg>">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Teko:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="preview" data-theme="E">

<div id="cE" class="concept on">
  <div class="top">
    <a href="https://sinemaofisitest.ibb.istanbul/" target="_blank" style="display:flex;align-items:center;flex-shrink:0;text-decoration:none;margin-right:4px">
      <img id="eLogoImg" src="assets/images/logo.png" alt="İBB Sinema Ofisi" style="height:43px;width:auto;display:block">
    </a>
    <div class="sw-d"></div>
    <div class="sw-s">İstanbul Film Mekanları Haritası</div>
    <div class="e-counts" id="eCountsEl">— film<br>— mekan</div>
    <div class="e-theme-toggle">
      <button id="eBtnSade" class="active" onclick="eSetTheme('sade')">☀</button>
      <button id="eBtnRenkli" onclick="eSetTheme('renkli')">☾</button>
    </div>
  </div>

  <div class="body">
    <!-- Sol sidebar -->
    <div class="e-sb">
      <div class="e-sb-h">MEKANLAR</div>
      <div class="e-loc-cat-chips" id="eLocCatChips"></div>
      <div id="eLocs"></div>
    </div>

    <!-- Harita + galeri (flex column) -->
    <div class="e-map-col">
    <div class="map-wrap">
      <div class="lmap" id="mapE"></div>
      <div class="e-search-wrap" id="eSearchWrap">
        <div class="e-search-box">
          <span class="e-search-icon">⌕</span>
          <input id="eSearchInput" class="e-search-input"
            placeholder="Film, mekan veya yönetmen ara…"
            autocomplete="off"
            oninput="eSearchType(this.value)"
            onfocus="eSearchType(this.value)"
            onkeydown="eSearchKey(event)">
          <button class="e-search-clear" id="eSearchClear" onclick="eSearchClear()">×</button>
        </div>
        <div class="e-search-drop" id="eSearchDrop"></div>
      </div>
    </div><!-- /map-wrap -->
    <!-- eLocBar: e-map-col içinde, doğal genişlikte, sidebarlara taşmaz -->
    <div id="eLocBar" class="e-loc-bar" style="display:none"></div>
    </div><!-- /e-map-col -->

    <!-- Sağ sidebar -->
    <div class="e-fp">
      <div class="e-fp-head">FİLMLER</div>
      <div class="e-dir-badge" id="eDirBadge" style="display:none">
        <span class="e-dir-badge-lbl" id="eDirBadgeLbl"></span>
        <button class="e-dir-badge-x" onclick="eSearchClear()">×</button>
      </div>
      <div class="e-genre-chips-inner" id="eGenreChips">
        <button class="e-genre-chip-inner on" onclick="eSetGenre('',this)">TÜMÜ</button>
      </div>
      <div class="e-decade-bar" id="eDecadeChips"><button class="e-decade-seg on" onclick="eSetDecade(0,this)">TÜMÜ</button></div>
      <div id="eFilms"></div>
    </div>
  </div><!-- /body -->



  <!-- Media panel: cE içinde, position:absolute cE bazlı -->
  <div id="mp">
    <div class="mp-top">
      <div class="mp-top-left">
        <div class="mp-title" id="mpTitle">Film Adı</div>
        <div class="mp-meta" id="mpMeta"></div>
      </div>
      <button class="mp-close" onclick="closeMedia()">✕</button>
    </div>
    <div class="mp-scroll">
      <div>
        <div class="mp-sec-label" id="mpHeroLabel">Sahne</div>
        <div class="mp-hero-wrap" onclick="mpOpenLightbox()" style="cursor:default">
          <img class="mp-hero" id="mpHero" src="" alt="">
          <div class="mp-hero-zoom">⤢</div>
        </div>
      </div>
      <div>
        <div class="mp-sec-label">Diğer Sahneler</div>
        <div class="mp-thumbs" id="mpThumbs"></div>
      </div>
      <hr class="mp-divider">
      <div class="mp-desc" id="mpDesc"></div>
      <div>
        <div class="mp-sec-label">Çekim Mekanları</div>
        <div class="mp-locs" id="mpLocs"></div>
      </div>
    </div>
  </div>

</div><!-- /cE -->

</div><!-- /preview -->

<!-- MOBİL BOTTOM NAV -->
<nav id="mobileNav">
  <button class="m-tab active" id="mTabHarita" onclick="mSetTab('harita',this)">
    <span class="m-tab-icon">⊞</span>
    <span class="m-tab-lbl">Harita</span>
  </button>
  <button class="m-tab" id="mTabMekanlar" onclick="mSetTab('mekanlar',this)">
    <span class="m-tab-icon">◎</span>
    <span class="m-tab-lbl">Mekanlar</span>
  </button>
  <button class="m-tab" id="mTabFilmler" onclick="mSetTab('filmler',this)">
    <span class="m-tab-icon">▶</span>
    <span class="m-tab-lbl">Filmler</span>
  </button>
</nav>

<div id="infobar">
  <div id="desc">İstanbul Sinema Coğrafyası · Çekim Mekan Atlası · İBB Sinema Ofisi</div>
  <div class="h">mekan → galeri &nbsp;|&nbsp; film → detay &nbsp;|&nbsp; Esc kapat</div>
</div>

<!-- GALLERY LIGHTBOX -->
<div id="gLightbox" onclick="gLbClose(event)">
  <button class="gl-close" onclick="closeGLb()">×</button>
  <button class="gl-nav gl-prev" onclick="event.stopPropagation();gLbNav(-1)">‹</button>
  <img id="gLbImg" src="" alt="">
  <div><div class="gl-film" id="gLbFilm"></div><div class="gl-caption" id="gLbCaption"></div></div>
  <button class="gl-nav gl-next" onclick="event.stopPropagation();gLbNav(1)">›</button>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/tmdb.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/init.js"></script>
</body>
</html>
