<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>İçerik Paneli — Sinemada İstanbul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="panel.css" rel="stylesheet">
</head>
<body>
  <!-- Giriş -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-box" autocomplete="off">
      <h1>Sinemada İstanbul<br><span>İçerik Paneli</span></h1>
      <label for="login-token">Erişim anahtarı</label>
      <input id="login-token" type="password" required autofocus>
      <label class="check"><input id="login-remember" type="checkbox"> Bu cihazda hatırla</label>
      <button type="submit" class="btn primary">Giriş</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </section>

  <!-- Uygulama -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">Sinemada İstanbul <span>/ İçerik Paneli</span></div>
      <nav id="nav" class="nav" aria-label="Bölümler"></nav>
      <div class="top-right">
        <span id="demo-badge" class="badge demo" hidden>DEMO</span>
        <span id="editor-name" class="muted"></span>
        <a class="btn ghost" href="../" target="_blank" rel="noopener">Haritayı aç ↗</a>
        <button id="btn-reload" class="btn ghost" title="Veriyi yeniden yükle">Yenile</button>
        <button id="btn-logout" class="btn ghost">Çıkış</button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="adapters.js"></script>
  <script src="panel.js"></script>
</body>
</html>
